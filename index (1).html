<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Neon Overdrive: Hell Vanguard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #05060f;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
    }
    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 600px;
      margin: 0 auto;
      background: radial-gradient(circle at center, #0f1026 0%, #050510 100%);
      overflow: hidden;
      box-shadow: 0 0 30px rgba(0, 243, 255, 0.2);
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    /* UI HUD Overlay */
    #hud {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 10;
      background: linear-gradient(to bottom, rgba(5,6,15,0.9), transparent);
    }
    .hud-stat {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .hud-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #8b9bb4;
      font-weight: 600;
    }
    .hud-value {
      font-size: 18px;
      font-weight: 800;
      color: #00f3ff;
      text-shadow: 0 0 8px rgba(0, 243, 255, 0.6);
    }
    .credits-val {
      color: #ffd700;
      text-shadow: 0 0 8px rgba(255, 215, 0, 0.6);
    }
    #hp-bar-container {
      width: 120px;
      height: 10px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(0, 243, 255, 0.5);
      border-radius: 5px;
      overflow: hidden;
      margin-top: 4px;
    }
    #hp-bar-fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #ff0055, #00ff88);
      transition: width 0.15s ease-out;
    }
    #boss-hp-container {
      position: absolute;
      top: 60px;
      left: 10%;
      width: 80%;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      z-index: 10;
      pointer-events: none;
    }
    #boss-hp-bar {
      width: 100%;
      height: 12px;
      background: rgba(0, 0, 0, 0.6);
      border: 2px solid #ff0055;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 0 15px rgba(255, 0, 85, 0.4);
    }
    #boss-hp-fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #ff7700, #ff0055);
      transition: width 0.1s ease-out;
    }
    #boss-name {
      font-size: 12px;
      letter-spacing: 2px;
      color: #ff0055;
      font-weight: 800;
      text-transform: uppercase;
    }
    /* Modals & Overlays */
    .overlay-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(5, 6, 15, 0.92);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      z-index: 50;
      overflow-y: auto;
      padding: 20px;
      box-sizing: border-box;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #00f3ff55;
      border-radius: 3px;
    }
    /* Menu & Hangar Tabs */
    .hangar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(0, 243, 255, 0.2);
      margin-bottom: 15px;
    }
    .nav-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(0, 243, 255, 0.2);
      color: #8b9bb4;
      font-size: 13px;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.2s;
    }
    .tab-btn.active {
      background: rgba(0, 243, 255, 0.2);
      border-color: #00f3ff;
      color: #00f3ff;
      box-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
    }
    /* Map Sector Grid */
    .map-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }
    .sector-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .sector-card.unlocked {
      border-color: rgba(0, 243, 255, 0.4);
      background: rgba(0, 243, 255, 0.05);
    }
    .sector-card.selected {
      border-color: #00ff88;
      box-shadow: 0 0 12px rgba(0, 255, 136, 0.3);
      background: rgba(0, 255, 136, 0.1);
    }
    .sector-card.locked {
      opacity: 0.4;
      cursor: not-allowed;
      filter: grayscale(1);
    }
    /* Shipyard Grid */
    .ship-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .ship-card.active-ship {
      border-color: #00f3ff;
      background: rgba(0, 243, 255, 0.08);
    }
    .ship-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    /* Augment Modal */
    #augment-screen {
      justify-content: center;
      align-items: center;
      display: none;
    }
    .aug-container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .aug-card {
      background: rgba(15, 20, 35, 0.95);
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      border: 1px solid;
    }
    .aug-card:hover {
      transform: translateY(-3px);
    }
    .aug-silver {
      border-color: #b0c4de;
      box-shadow: 0 0 10px rgba(176, 196, 222, 0.2);
    }
    .aug-gold {
      border-color: #ffd700;
      box-shadow: 0 0 12px rgba(255, 215, 0, 0.25);
    }
    .aug-prismatic {
      border-color: #ff00ff;
      box-shadow: 0 0 15px rgba(255, 0, 255, 0.35);
    }
    .aug-badge {
      font-size: 10px;
      text-transform: uppercase;
      font-weight: 800;
      letter-spacing: 1px;
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      width: fit-content;
    }
    .badge-silver { background: rgba(176,196,222,0.2); color: #b0c4de; }
    .badge-gold { background: rgba(255,215,0,0.2); color: #ffd700; }
    .badge-prismatic { background: rgba(255,0,255,0.2); color: #ff00ff; }
    /* Primary Action Buttons */
    .btn-action {
      padding: 12px 24px;
      border: none;
      border-radius: 6px;
      background: linear-gradient(135deg, #00f3ff, #0077ff);
      color: #fff;
      font-weight: 800;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
      transition: all 0.2s;
      text-align: center;
      text-transform: uppercase;
      font-size: 14px;
    }
    .btn-action:hover {
      filter: brightness(1.15);
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.6);
    }
    .audio-btn {
      position: absolute;
      bottom: 12px;
      right: 12px;
      background: rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      z-index: 60;
    }
    /* Floating Reward Notification */
    #reward-toast {
      position: absolute;
      top: 100px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 255, 136, 0.2);
      border: 1px solid #00ff88;
      color: #00ff88;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 700;
      display: none;
      z-index: 30;
      pointer-events: none;
      animation: floatUp 1.2s ease-out forwards;
    }
    @keyframes floatUp {
      0% { opacity: 0; transform: translate(-50%, 10px); }
      20% { opacity: 1; transform: translate(-50%, 0); }
      80% { opacity: 1; }
      100% { opacity: 0; transform: translate(-50%, -20px); }
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="canvas"></canvas>

    <!-- Top HUD -->
    <div id="hud">
      <div class="hud-stat">
        <span class="hud-title">Tiến trình</span>

    <!-- Augment Screen (Wave 5) -->
    <div id="augment-screen" class="overlay-screen">

        <div style="text-align: center; margin-bottom: 10px;">
          <h2 style="color: #00f3ff; font-size: 20px; letter-spacing: 2px;">LÕI CÔNG NGHỆ</h2>

    <!-- Hangar & Sector Map Overlay -->

        </div>

      <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchHangarTab('map')">Bản đồ (10 Màn)</button>

      <!-- Tab 1: Sector Map -->

    <!-- Start / Game Over Modal -->
    <div id="game-over-screen" class="overlay-screen" style="display: none; justify-content: center; align-items: center;">
      <div style="text-align: center; max-width: 380px;">
        <h1 style="color: #ff0055; font-size: 28px; margin-bottom: 8px;" id="game-over-title">PHI THUYỀN BỊ PHÁ HỦY</h1>
        <p style="color: #8b9bb4; font-size: 14px; margin-bottom: 20px;" id="game-over-desc">Toàn bộ liên lạc với hạm đội đã gián đoạn.</p>
        <button class="btn-action" style="width: 100%;" onclick="returnToHangar()">VỀ TRẠM HANGAR</button>
      </div>

    <button class="audio-btn" id="audio-toggle" onclick="toggleAudio()">🔊 ÂM THANH: BẬT</button>
  </div>

  <script>
    /* =========================================================
       AUDIO SYSTEM (Synthwave Synth & SFX via Web Audio API)
    ========================================================= */
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.muted = false;
        this.bgmPlaying = false;
        this.bgmTimer = null;
        this.step = 0;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
        if (!this.bgmPlaying && !this.muted) {
          this.startBGM();
        }
      }
      playLaser(freq = 440) {
        if (this.muted || !this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.12);
          gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.12);
        } catch(e) {}
      }
      playExplosion() {
        if (this.muted || !this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(120, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.25);
          gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.25);
        } catch(e) {}
      }
      playPowerup() {
        if (this.muted || !this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(320, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(780, this.ctx.currentTime + 0.2);
          gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.2);
        } catch(e) {}
      }
      startBGM() {
        this.bgmPlaying = true;
        const bassNotes = [65.41, 65.41, 77.78, 87.31, 58.27, 58.27, 73.42, 82.41]; // C2, Eb2, F2, Bb1...
        const synthNotes = [261.63, 311.13, 392.00, 466.16, 523.25, 466.16, 392.00, 311.13];
        this.bgmTimer = setInterval(() => {
          if (this.muted || !this.ctx) return;
          try {
            const time = this.ctx.currentTime;
            // Bass Kick / Synth Bass
            const bOsc = this.ctx.createOscillator();
            const bGain = this.ctx.createGain();
            bOsc.type = 'sawtooth';
            bOsc.frequency.setValueAtTime(bassNotes[this.step % bassNotes.length], time);
            bGain.gain.setValueAtTime(0.04, time);
            bGain.gain.exponentialRampToValueAtTime(0.001, time + 0.18);
            bOsc.connect(bGain);
            bGain.connect(this.ctx.destination);
            bOsc.start(time);
            bOsc.stop(time + 0.18);

            // Synth Arp
            if (this.step % 2 === 0) {
              const aOsc = this.ctx.createOscillator();
              const aGain = this.ctx.createGain();
              aOsc.type = 'sine';
              aOsc.frequency.setValueAtTime(synthNotes[(this.step / 2) % synthNotes.length], time);
              aGain.gain.setValueAtTime(0.02, time);
              aGain.gain.exponentialRampToValueAtTime(0.001, time + 0.15);
              aOsc.connect(aGain);
              aGain.connect(this.ctx.destination);
              aOsc.start(time);
              aOsc.stop(time + 0.15);
            }
            this.step++;
          } catch(e) {}
        }, 160);
      }
      toggle() {
        this.muted = !this.muted;
        return !this.muted;
      }
    }
    const audio = new SoundEngine();
    function toggleAudio() {
      const state = audio.toggle();
      document.getElementById('audio-toggle').innerText = state ? '🔊 ÂM THANH: BẬT' : '🔇 ÂM THANH: TẮT';
      if (state) audio.init();
    }

    /* =========================================================
       GAME STATE & CONFIGURATION
    ========================================================= */
    const WEAPONS = [
      { id: 'plasma', name: 'Plasma Bolt', color: '#00f3ff', desc: 'Đạn năng lượng tập trung' },
      { id: 'laser', name: 'Laser Beam', color: '#ff0055', desc: 'Tia laser xuyên thấu' },
      { id: 'missile', name: 'Homing Pod', color: '#ffaa00', desc: 'Tên lửa tự bám đuôi (đã cân bằng)' },
      { id: 'spread', name: 'Spread Shot', color: '#00ff88', desc: 'Bắn xòe cánh quạt' },
      { id: 'lightning', name: 'Lightning Arc', color: '#ffff00', desc: 'Sét giật lan truyền' },
      { id: 'void', name: 'Void Bomb', color: '#cc00ff', desc: 'Quả cầu phát nổ AoE' },
      { id: 'gatling', name: 'Gatling Flurry', color: '#00d0ff', desc: 'Mưa liên thanh tốc bắn cao' },
      { id: 'shuriken', name: 'Plasma Disc', color: '#ff00aa', desc: 'Đĩa năng lượng nảy bật tường' }
    ];

    const SHIPS = [
      { id: 'vanguard', name: 'Vanguard Alpha', price: 0, hp: 100, speed: 6, trait: 'Chỉ số cân bằng, dễ làm quen' },
      { id: 'phantom', name: 'Phantom Striker', price: 1200, hp: 80, speed: 7.5, trait: 'Tốc độ cực nhanh, +15% né tránh' },
      { id: 'titan', name: 'Titan Dreadnought', price: 2800, hp: 170, speed: 4.8, trait: 'Giáp thép siêu dày, chống sốc tốt' },
      { id: 'stormbringer', name: 'Stormbringer', price: 4500, hp: 110, speed: 6.2, trait: 'Đòn đánh phụ phóng điện ngẫu nhiên' },
      { id: 'void_reaver', name: 'Void Reaver', price: 7000, hp: 130, speed: 5.8, trait: 'Hút đạn địch thành năng lượng khi thấp máu' },
      { id: 'solaris', name: 'Solaris Prime', price: 11000, hp: 150, speed: 6.5, trait: 'Tự phục hồi 2% HP mỗi 3 giây' }
    ];

    const AUGMENTS_POOL = [
      // Bạc
      { id: 's_spd', tier: 'silver', title: 'Động Cơ Siêu Nén', desc: '+12% Tốc độ di chuyển của phi thuyền' },
      { id: 's_hp', tier: 'silver', title: 'Gia Cố Thân Tàu', desc: '+30 HP tối đa và hồi ngay 30 HP' },
      { id: 's_regen', tier: 'silver', title: 'Hệ Thống Tự Sửa', desc: 'Hồi 0.8 HP mỗi giây trong trận đấu' },
      { id: 's_atk', tier: 'silver', title: 'Tụ Điện Cải Tiến', desc: '+10% Tốc độ ra đạn toàn bộ vũ khí' },
      // Vàng
      { id: 'g_dmg', tier: 'gold', title: 'Đầu Đạn Phóng Xạ', desc: '+15% Toàn bộ sát thương đầu ra' },
      { id: 'g_shield', tier: 'gold', title: 'Khiên Khởi Đầu', desc: 'Nhận 1 lớp khiên bảo hộ ở đầu mỗi trận' },
      { id: 'g_crit', tier: 'gold', title: 'Lăng Kính Hội Tụ', desc: '+18% Tỷ lệ bắn chí mạng (x1.75 sát thương)' },
      { id: 'g_magnet', tier: 'gold', title: 'Từ Trường Năng Lượng', desc: 'Tăng 80% bán kính hút vật phẩm cứu viện' },
      // Kim Cương (Prismatic)
      { id: 'p_pulse', tier: 'prismatic', title: 'Xung Chấn Phản Vệ', desc: 'Khi mất máu, phát sóng xung kích xóa đạn địch' },
      { id: 'p_vamp', tier: 'prismatic', title: 'Hấp Thụ Hư Không', desc: 'Mỗi khi tiêu diệt 10 kẻ địch, hồi ngay 8 HP' }
    ];

    // Profile Persistent Save
    let profile = {
      credits: 0,
      unlockedSectors: 1,
      selectedSector: 1,
      clearedSectors: [],
      ownedShips: ['vanguard'],
      currentShip: 'vanguard',
      lab: { dmg: 0, hp: 0, speed: 0, luck: 0 }
    };

    function loadProfile() {
      try {
        const data = localStorage.getItem('neon_overdrive_save');
        if (data) {
          const parsed = JSON.parse(data);
          profile = { ...profile, ...parsed };
        }
      } catch(e) {}
    }
    function saveProfile() {
      try {
        localStorage.setItem('neon_overdrive_save', JSON.stringify(profile));
      } catch(e) {}
    }
    loadProfile();

    /* =========================================================
       CANVAS & GAME ENGINE
    ========================================================= */
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      const box = document.getElementById('game-container').getBoundingClientRect();
      canvas.width = box.width;
      canvas.height = box.height;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Game Variables
    let currentWave = 1;      // Trận 1 -> 10
    let enemiesLeftToSpawn = 0;
    let spawnTimer = 0;
    let waveState = 'INTERMISSION'; // INTERMISSION, COMBAT, BOSS, AUGMENT_PAUSE, GAME_OVER
    let intermissionTime = 0;
    let score = 0;

    let player = {
      x: canvas.width / 2,
      y: canvas.height - 80,
      w: 32,
      h: 32,
      hp: 100,
      maxHp: 100,
      speed: 6,
      weapon: 'plasma',
      weaponLvl: 1,
      weaponProgress: 0, // 2 items to level up
      fireTimer: 0,
      hasShield: false,
      augments: []
    };

    let bullets = [];
    let enemyBullets = [];
    let enemies = [];
    let pickups = []; // Only HP & Weapons now!
    let particles = [];
    let stars = [];
    let boss = null;

    // Inputs
    let pointerX = canvas.width / 2;
    let pointerY = canvas.height - 80;
    let isTouching = false;
    let keys = {};

    window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; audio.init(); });
    window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

    canvas.addEventListener('pointerdown', e => {
      audio.init();
      isTouching = true;
      updatePointer(e);
    });
    canvas.addEventListener('pointermove', e => {
      if (isTouching) updatePointer(e);
    });
    window.addEventListener('pointerup', () => isTouching = false);

    function updatePointer(e) {
      const rect = canvas.getBoundingClientRect();
      pointerX = e.clientX - rect.left;
      pointerY = e.clientY - rect.top;
    }

    // Stars Background
    for (let i = 0; i < 60; i++) {
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 2 + 0.5,
        speed: Math.random() * 2 + 0.8
      });
    }

    /* =========================================================
       HANGAR & UI CONTROLS
    ========================================================= */
    function renderHangar() {
      document.getElementById('hangar-credits-display').innerText = profile.credits + ' 🪙';
      document.getElementById('hud-credits').innerText = profile.credits + ' 🪙';

      // 1. Render Map
      const mapContainer = document.getElementById('map-grid-container');
      mapContainer.innerHTML = '';
      for (let i = 1; i <= 10; i++) {
        const isUnlocked = i <= profile.unlockedSectors;
        const isSelected = i === profile.selectedSector;
        const isCleared = profile.clearedSectors.includes(i);
        const card = document.createElement('div');
        card.className = `sector-card ${isUnlocked ? 'unlocked' : 'locked'} ${isSelected ? 'selected' : ''}`;
        card.innerHTML = `
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <span style="font-weight: 800; font-size: 14px; color: ${isSelected ? '#00ff88' : '#00f3ff'}">MÀN ${i}</span>
            <span style="font-size: 11px; color: #8b9bb4;">${isCleared ? '✓ Đã hạ' : (isUnlocked ? 'Sẵn sàng' : '🔒 Khóa')}</span>
          </div>
          <div style="font-size: 11px; color: #aaa;">Độ khó x${Math.pow(1.3, i - 1).toFixed(2)}</div>
          <div style="font-size: 11px; color: #ffd700;">Thưởng: ~${i * 450} 🪙 ${isCleared ? '(65% cày lại)' : ''}</div>
        `;
        if (isUnlocked) {
          card.onclick = () => {
            profile.selectedSector = i;
            saveProfile();
            renderHangar();
          };
        }
        mapContainer.appendChild(card);
      }

      // 2. Render Shipyard
      const shipList = document.getElementById('shipyard-list');
      shipList.innerHTML = '';
      SHIPS.forEach(ship => {
        const isOwned = profile.ownedShips.includes(ship.id);
        const isSelected = profile.currentShip === ship.id;
        const div = document.createElement('div');
        div.className = `ship-card ${isSelected ? 'active-ship' : ''}`;
        div.innerHTML = `
          <div class="ship-row">
            <span style="font-size: 15px; font-weight: 800; color: #00f3ff;">${ship.name}</span>
            <span style="font-size: 13px; font-weight: 700; color: #ffd700;">${isOwned ? (isSelected ? '● ĐANG LÁI' : 'SỞ HỮU') : ship.price + ' 🪙'}</span>
          </div>
          <div style="font-size: 12px; color: #8b9bb4;">HP: ${ship.hp} | Tốc độ: ${ship.speed}</div>
          <div style="font-size: 12px; color: #00ff88;">Đặc tính: ${ship.trait}</div>
          <button class="btn-action" style="padding: 6px 12px; margin-top: 6px; font-size: 12px;" onclick="handleShipAction('${ship.id}')">
            ${isOwned ? (isSelected ? 'ĐÃ TRANG BỊ' : 'CHỌN LÁI') : 'MUA PHI THUYỀN'}
          </button>
        `;
        shipList.appendChild(div);
      });

      // 3. Render Lab
      const labList = document.getElementById('tab-lab');
      labList.innerHTML = `
        <div style="display: flex; flex-direction: column; gap: 12px;">
          ${createLabItem('Sát Thương Năng Lượng (+8%)', 'dmg', profile.lab.dmg)}
          ${createLabItem('Giáp Thân Vỏ (+15 HP)', 'hp', profile.lab.hp)}
          ${createLabItem('Động Cơ Phản Lực (+6% Tốc)', 'speed', profile.lab.speed)}
          ${createLabItem('Tần Suất Cứu Viện (+10% Hòm)', 'luck', profile.lab.luck)}
        </div>
      `;
    }

    function createLabItem(title, key, lvl) {
      const cost = Math.floor(250 * Math.pow(1.5, lvl));
      return `
        <div class="ship-card">
          <div class="ship-row">
            <span style="font-weight: 700; color: #00f3ff;">${title}</span>
            <span style="color: #ffd700; font-weight: 800;">Cấp ${lvl}</span>
          </div>
          <div class="ship-row" style="margin-top: 6px;">
            <span style="font-size: 12px; color: #8b9bb4;">Giá nâng: ${cost} 🪙</span>
            <button class="btn-action" style="padding: 4px 10px; font-size: 11px;" onclick="upgradeLab('${key}', ${cost})">NÂNG CẤP</button>
          </div>
        </div>
      `;
    }

    function switchHangarTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('tab-map').style.display = 'none';
      document.getElementById('tab-shipyard').style.display = 'none';
      document.getElementById('tab-lab').style.display = 'none';

      if (tab === 'map') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('tab-map').style.display = 'block';
      } else if (tab === 'shipyard') {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('tab-shipyard').style.display = 'block';
      } else {
        document.querySelectorAll('.tab-btn')[2].classList.add('active');
        document.getElementById('tab-lab').style.display = 'block';
      }
    }

    function handleShipAction(shipId) {
      const ship = SHIPS.find(s => s.id === shipId);
      if (profile.ownedShips.includes(shipId)) {
        profile.currentShip = shipId;
      } else {
        if (profile.credits >= ship.price) {
          profile.credits -= ship.price;
          profile.ownedShips.push(shipId);
          profile.currentShip = shipId;
        } else {
          alert('Không đủ Credits!');
        }
      }
      saveProfile();
      renderHangar();
    }

    function upgradeLab(key, cost) {
      if (profile.credits >= cost) {
        profile.credits -= cost;
        profile.lab[key]++;
        saveProfile();
        renderHangar();
      } else {
        alert('Không đủ Credits!');
      }
    }

    /* =========================================================
       GAMEPLAY LOGIC & PROGRESSION
    ========================================================= */
    function startSectorFlight() {
      audio.init();
      document.getElementById('hangar-screen').style.display = 'none';
      document.getElementById('game-over-screen').style.display = 'none';

      // Load Ship Stats
      const shipConfig = SHIPS.find(s => s.id === profile.currentShip) || SHIPS[0];
      const bonusHp = profile.lab.hp * 15;
      const bonusSpeed = profile.lab.speed * 0.35;

      player = {
        x: canvas.width / 2,
        y: canvas.height - 80,
        w: 30,
        h: 30,
        hp: shipConfig.hp + bonusHp,
        maxHp: shipConfig.hp + bonusHp,
        speed: shipConfig.speed + bonusSpeed,
        weapon: 'plasma',
        weaponLvl: 1,
        weaponProgress: 0,
        fireTimer: 0,
        hasShield: false,
        augments: []
      };

      currentWave = 1;
      bullets = [];
      enemyBullets = [];
      enemies = [];
      pickups = [];
      particles = [];
      boss = null;

      startWave(1);
    }

    function startWave(waveNum) {
      currentWave = waveNum;
      document.getElementById('hud-progress').innerText = `MÀN ${profile.selectedSector} / TRẬN ${currentWave}`;
      
      if (currentWave === 10) {
        // Boss Battle
        waveState = 'BOSS';
        enemiesLeftToSpawn = 0;
        spawnBoss();
      } else {
        // Normal Wave
        waveState = 'COMBAT';
        enemiesLeftToSpawn = 6 + currentWave * 2;
        spawnTimer = 0;
      }
      updateHUD();
    }

    function completeWave() {
      // Automatic Reward Calculation (No coin items)
      const sectorMul = Math.pow(1.15, profile.selectedSector - 1);
      const isClearedBefore = profile.clearedSectors.includes(profile.selectedSector);
      let rewardCredits = Math.floor((35 + currentWave * 12 + Math.random() * 20) * sectorMul);
      if (isClearedBefore) rewardCredits = Math.floor(rewardCredits * 0.65);

      profile.credits += rewardCredits;
      saveProfile();
      showRewardToast(`+${rewardCredits} 🪙`);

      if (currentWave === 5) {
        // Trigger TFT Augments
        waveState = 'AUGMENT_PAUSE';
        showAugmentModal();
        return;
      }

      if (currentWave === 10) {
        // Sector Cleared!
        if (!profile.clearedSectors.includes(profile.selectedSector)) {
          profile.clearedSectors.push(profile.selectedSector);
        }
        if (profile.selectedSector === profile.unlockedSectors && profile.unlockedSectors < 10) {
          profile.unlockedSectors++;
        }
        saveProfile();
        setTimeout(() => {
          returnToHangar(true);
        }, 1500);
        return;
      }

      // Next normal wave
      waveState = 'INTERMISSION';
      intermissionTime = 60;
    }

    function showRewardToast(text) {
      const toast = document.getElementById('reward-toast');
      toast.innerText = text;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 1200);
    }

    function showAugmentModal() {
      const screen = document.getElementById('augment-screen');
      const list = document.getElementById('aug-options-list');
      list.innerHTML = '';

      // Random 3 augments
      const shuffled = [...AUGMENTS_POOL].sort(() => 0.5 - Math.random()).slice(0, 3);
      shuffled.forEach(aug => {
        const div = document.createElement('div');
        div.className = `aug-card aug-${aug.tier}`;
        div.innerHTML = `
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <span style="font-weight: 800; font-size: 14px; color: #fff;">${aug.title}</span>
            <span class="aug-badge badge-${aug.tier}">${aug.tier}</span>
          </div>
          <p style="font-size: 12px; color: #b0c4de;">${aug.desc}</p>
        `;
        div.onclick = () => {
          applyAugment(aug);
          screen.style.display = 'none';
          waveState = 'COMBAT';
          startWave(6);
        };
        list.appendChild(div);
      });
      screen.style.display = 'flex';
    }

    function applyAugment(aug) {
      player.augments.push(aug.id);
      if (aug.id === 's_hp') {
        player.maxHp += 30;
        player.hp = Math.min(player.maxHp, player.hp + 30);
      }
      if (aug.id === 's_spd') player.speed *= 1.12;
      if (aug.id === 'g_shield') player.hasShield = true;
    }

    function returnToHangar(victory = false) {
      document.getElementById('boss-hp-container').style.display = 'none';
      document.getElementById('augment-screen').style.display = 'none';
      document.getElementById('game-over-screen').style.display = 'none';
      document.getElementById('hangar-screen').style.display = 'flex';
      renderHangar();
    }

    /* =========================================================
       ENEMIES & BOSS GENERATION
    ========================================================= */
    function spawnEnemy() {
      const sectorScale = Math.pow(1.2, profile.selectedSector - 1);
      const waveScale = 1 + (currentWave * 0.1);
      const hp = (18 + Math.random() * 15) * sectorScale * waveScale;
      
      const type = Math.random() > 0.4 ? 'chaser' : 'shooter';
      enemies.push({
        x: 30 + Math.random() * (canvas.width - 60),
        y: -30,
        w: 24,
        h: 24,
        hp: hp,
        maxHp: hp,
        type: type,
        speed: 1.8 + Math.random() * 1.5,
        shootCooldown: 60 + Math.random() * 80
      });
    }

    function spawnBoss() {
      document.getElementById('boss-hp-container').style.display = 'flex';
      const sectorScale = Math.pow(1.35, profile.selectedSector - 1);
      const bossHp = 650 * sectorScale;
      boss = {
        x: canvas.width / 2,
        y: 90,
        w: 64,
        h: 64,
        hp: bossHp,
        maxHp: bossHp,
        patternTimer: 0,
        pattern: 0
      };

    /* =========================================================
       SHOOTING & WEAPONS SYSTEM
    ========================================================= */
    function firePlayerWeapon() {
      const lvl = player.weaponLvl;
      const baseDmgBonus = 1 + (profile.lab.dmg * 0.08) + (player.augments.includes('g_dmg') ? 0.15 : 0);
      let crit = (Math.random() < (player.augments.includes('g_crit') ? 0.18 : 0.05)) ? 1.75 : 1.0;

      audio.playLaser(player.weapon === 'laser' ? 680 : 420);

      if (player.weapon === 'plasma') {
        // High Single/Twin Shot
        const count = lvl >= 3 ? 2 : 1;
        const dmg = 22 * baseDmgBonus * crit;
        if (count === 1) {
          bullets.push({ x: player.x, y: player.y - 15, vx: 0, vy: -12, dmg: dmg, type: 'plasma', color: '#00f3ff', r: 4 });
        } else {
          bullets.push({ x: player.x - 8, y: player.y - 15, vx: 0, vy: -12, dmg: dmg, type: 'plasma', color: '#00f3ff', r: 4 });
          bullets.push({ x: player.x + 8, y: player.y - 15, vx: 0, vy: -12, dmg: dmg, type: 'plasma', color: '#00f3ff', r: 4 });
        }
      } else if (player.weapon === 'laser') {
        // Piercing Beam
        bullets.push({ x: player.x, y: player.y - 18, vx: 0, vy: -16, dmg: (14 + lvl * 3) * baseDmgBonus * crit, pierce: lvl, type: 'laser', color: '#ff0055', r: 3 });
      } else if (player.weapon === 'missile') {
        // BALANCED Homing Missile
        const count = lvl >= 4 ? 3 : (lvl >= 2 ? 2 : 1);
        const dmg = (10 + lvl * 2) * baseDmgBonus * crit; // Sát thương điều chỉnh giảm cân bằng
        for (let i = 0; i < count; i++) {
          const angle = -Math.PI / 2 + (i - (count - 1) / 2) * 0.3;
          bullets.push({
            x: player.x,
            y: player.y - 10,
            vx: Math.cos(angle) * 7,
            vy: Math.sin(angle) * 7,
            dmg: dmg,
            type: 'missile',
            color: '#ffaa00',
            r: 4,
            homingSpeed: 3.5 // Tốc độ lượn chậm vừa phải
          });
        }
      } else if (player.weapon === 'spread') {
        // Fan Spread
        const count = 2 + lvl;
        const baseAngle = -Math.PI / 2;
        const spreadArc = 0.55;
        for (let i = 0; i < count; i++) {
          const angle = baseAngle - spreadArc / 2 + (spreadArc / (count - 1)) * i;
          bullets.push({
            x: player.x,
            y: player.y - 12,
            vx: Math.cos(angle) * 10,
            vy: Math.sin(angle) * 10,
            dmg: (10 + lvl * 2) * baseDmgBonus * crit,
            type: 'spread',
            color: '#00ff88',
            r: 3
          });
        }
      } else if (player.weapon === 'lightning') {
        bullets.push({ x: player.x, y: player.y - 15, vx: 0, vy: -13, dmg: (16 + lvl * 3) * baseDmgBonus * crit, type: 'lightning', color: '#ffff00', r: 4 });
      } else if (player.weapon === 'void') {
        bullets.push({ x: player.x, y: player.y - 15, vx: 0, vy: -8, dmg: (30 + lvl * 6) * baseDmgBonus * crit, type: 'void', color: '#cc00ff', r: 7 });
      } else if (player.weapon === 'gatling') {
        const spread = (Math.random() - 0.5) * 2;
        bullets.push({ x: player.x + spread * 2, y: player.y - 15, vx: spread, vy: -14, dmg: (9 + lvl * 1.5) * baseDmgBonus * crit, type: 'gatling', color: '#00d0ff', r: 2.5 });
      } else if (player.weapon === 'shuriken') {
        bullets.push({ x: player.x, y: player.y - 15, vx: (Math.random() - 0.5) * 6, vy: -9, bounces: 3 + lvl, dmg: (15 + lvl * 2) * baseDmgBonus * crit, type: 'shuriken', color: '#ff00aa', r: 5 });
      }
    }

    /* =========================================================
       MAIN UPDATE & RENDER LOOP
    ========================================================= */
    function update() {
      // 1. Starfield Background
      stars.forEach(s => {
        s.y += s.speed;
        if (s.y > canvas.height) { s.y = 0; s.x = Math.random() * canvas.width; }
      });

      // Check Intermission
      if (waveState === 'INTERMISSION') {
        intermissionTime--;
        if (intermissionTime <= 0) {
          startWave(currentWave + 1);
        }
      }

      // Check Player Alive
      if (player.hp <= 0 && waveState !== 'GAME_OVER') {
        waveState = 'GAME_OVER';
        document.getElementById('game-over-screen').style.display = 'flex';
        audio.playExplosion();
        return;
      }

      // Regen Augment
      if (player.augments.includes('s_regen') && player.hp < player.maxHp) {
        player.hp = Math.min(player.maxHp, player.hp + 0.015);
      }

      // Player Movement
      if (isTouching) {
        player.x += (pointerX - player.x) * 0.18;
        player.y += (pointerY - player.y) * 0.18;
      }
      if (keys['a'] || keys['arrowleft']) player.x -= player.speed;
      if (keys['d'] || keys['arrowright']) player.x += player.speed;
      if (keys['w'] || keys['arrowup']) player.y -= player.speed;
      if (keys['s'] || keys['arrowdown']) player.y += player.speed;

      player.x = Math.max(20, Math.min(canvas.width - 20, player.x));
      player.y = Math.max(40, Math.min(canvas.height - 40, player.y));

      // Player Fire
      const atkSpd = (player.augments.includes('s_atk') ? 0.88 : 1.0);
      let cooldown = (player.weapon === 'gatling' ? 7 : 14) * atkSpd;
      player.fireTimer++;
      if (player.fireTimer >= cooldown && (waveState === 'COMBAT' || waveState === 'BOSS')) {
        firePlayerWeapon();
        player.fireTimer = 0;
      }

      // Spawn Enemies
      if (waveState === 'COMBAT' && enemiesLeftToSpawn > 0) {
        spawnTimer++;
        if (spawnTimer >= 45) {
          spawnEnemy();
          enemiesLeftToSpawn--;
          spawnTimer = 0;
        }
      }

      // Update Player Bullets
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        if (b.type === 'missile') {
          // Subtle homing towards nearest enemy or boss
          let target = boss || enemies[0];
          if (target) {
            const dx = target.x - b.x;
            const dy = target.y - b.y;
            const targetAngle = Math.atan2(dy, dx);
            let curAngle = Math.atan2(b.vy, b.vx);
            let diff = targetAngle - curAngle;
            while (diff < -Math.PI) diff += Math.PI * 2;
            while (diff > Math.PI) diff -= Math.PI * 2;
            curAngle += Math.sign(diff) * Math.min(Math.abs(diff), 0.08);
            const spd = 7;
            b.vx = Math.cos(curAngle) * spd;
            b.vy = Math.sin(curAngle) * spd;
          }
        } else if (b.type === 'shuriken') {
          if (b.x < 10 || b.x > canvas.width - 10) { b.vx = -b.vx; b.bounces--; }
        }

        b.x += b.vx;
        b.y += b.vy;

        // Bullet Out of bounds
        if (b.y < -20 || b.y > canvas.height + 20 || b.x < -20 || b.x > canvas.width + 20 || (b.bounces !== undefined && b.bounces <= 0)) {
          bullets.splice(i, 1);
          continue;
        }

        // Bullet vs Boss
        if (boss && checkCircleCollision(b.x, b.y, b.r, boss.x, boss.y, boss.w / 2)) {
          boss.hp -= b.dmg;
          createHitParticles(b.x, b.y, b.color);
          if (!b.pierce) { bullets.splice(i, 1); continue; }
          else { b.pierce--; if (b.pierce <= 0) { bullets.splice(i, 1); continue; } }
        }

        // Bullet vs Enemies
        for (let j = enemies.length - 1; j >= 0; j--) {
          const e = enemies[j];
          if (checkCircleCollision(b.x, b.y, b.r, e.x, e.y, e.w / 2)) {
            e.hp -= b.dmg;
            createHitParticles(b.x, b.y, b.color);
            if (!b.pierce) bullets.splice(i, 1);
            else { b.pierce--; if (b.pierce <= 0) bullets.splice(i, 1); }

            if (e.hp <= 0) {
              handleEnemyDeath(e);
              enemies.splice(j, 1);
            }
            break;
          }
        }
      }

      // Update Boss
      if (boss) {
        boss.patternTimer++;
        boss.x = canvas.width / 2 + Math.sin(boss.patternTimer * 0.03) * (canvas.width * 0.35);

        // Boss Bullet Hell Patterns
        if (boss.patternTimer % 50 === 0) {
          const count = 10;
          for (let k = 0; k < count; k++) {
            const angle = (Math.PI * 2 / count) * k + (boss.patternTimer * 0.05);
            enemyBullets.push({
              x: boss.x,
              y: boss.y,
              vx: Math.cos(angle) * 3.5,
              vy: Math.sin(angle) * 3.5,
              r: 4,
              color: '#ff0055'
            });
          }
        }

        document.getElementById('boss-hp-fill').style.width = Math.max(0, (boss.hp / boss.maxHp) * 100) + '%';
        if (boss.hp <= 0) {
          audio.playExplosion();
          createExplosion(boss.x, boss.y, '#ff0055', 40);
          boss = null;
          document.getElementById('boss-hp-container').style.display = 'none';
          completeWave();
        }
      }

      // Update Enemies
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        e.y += e.speed;

        if (e.type === 'shooter') {
          e.shootCooldown--;
          if (e.shootCooldown <= 0) {
            enemyBullets.push({ x: e.x, y: e.y + 10, vx: 0, vy: 4.5, r: 3.5, color: '#ff3366' });
            e.shootCooldown = 90;
          }
        }

        // Enemy Collide Player
        if (checkCircleCollision(e.x, e.y, e.w / 2, player.x, player.y, player.w / 2)) {
          takePlayerDamage(25);
          enemies.splice(i, 1);
          continue;
        }

        if (e.y > canvas.height + 40) {
          enemies.splice(i, 1);
        }
      }

      // Check Combat Wave Clear
      if (waveState === 'COMBAT' && enemiesLeftToSpawn <= 0 && enemies.length === 0) {
        completeWave();
      }

      // Update Enemy Bullets
      for (let i = enemyBullets.length - 1; i >= 0; i--) {
        const eb = enemyBullets[i];
        eb.x += eb.vx;
        eb.y += eb.vy;

        if (checkCircleCollision(eb.x, eb.y, eb.r, player.x, player.y, player.w / 2)) {
          takePlayerDamage(14);
          enemyBullets.splice(i, 1);
          continue;
        }

        if (eb.y > canvas.height + 20 || eb.x < -20 || eb.x > canvas.width + 20) {
          enemyBullets.splice(i, 1);
        }
      }

      // Update Pickups (Only Heal & Weapons!)
      for (let i = pickups.length - 1; i >= 0; i--) {
        const p = pickups[i];
        p.y += 1.8;

        // Magnet check
        if (player.augments.includes('g_magnet')) {
          const dx = player.x - p.x;
          const dy = player.y - p.y;
          const dist = Math.hypot(dx, dy);
          if (dist < 160) {
            p.x += (dx / dist) * 4;
            p.y += (dy / dist) * 4;
          }
        }

        if (checkCircleCollision(p.x, p.y, 14, player.x, player.y, player.w / 2)) {
          audio.playPowerup();
          if (p.kind === 'hp') {
            player.hp = Math.min(player.maxHp, player.hp + player.maxHp * 0.25);
          } else if (p.kind === 'weapon') {
            if (player.weapon === p.weaponId) {
              player.weaponProgress++;
              if (player.weaponProgress >= 2 && player.weaponLvl < 5) {
                player.weaponLvl++;
                player.weaponProgress = 0;
              }
            } else {
              player.weapon = p.weaponId;
              player.weaponLvl = 1;
              player.weaponProgress = 0;
            }
          }
          pickups.splice(i, 1);
          updateHUD();
          continue;
        }

        if (p.y > canvas.height + 30) pickups.splice(i, 1);
      }

      // Update Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i];
        pt.x += pt.vx;
        pt.y += pt.vy;
        pt.alpha -= 0.025;
        if (pt.alpha <= 0) particles.splice(i, 1);
      }

      updateHUD();
    }

    function takePlayerDamage(amount) {
      if (player.hasShield) {
        player.hasShield = false;
        createExplosion(player.x, player.y, '#00f3ff', 15);
        return;
      }
      player.hp -= amount;
      createExplosion(player.x, player.y, '#ff0055', 10);
      if (player.augments.includes('p_pulse')) {
        // Clear nearby enemy bullets on hit
        enemyBullets = [];
      }
    }

    function handleEnemyDeath(e) {
      audio.playExplosion();
      createExplosion(e.x, e.y, '#ffaa00', 12);
      score += 50;

      // Drop Pickups Chance
      const dropRoll = Math.random();
      const luckBonus = profile.lab.luck * 0.02;
      if (dropRoll < 0.15 + luckBonus) {
        // Drop Heal
        pickups.push({ x: e.x, y: e.y, kind: 'hp' });
      } else if (dropRoll < 0.35 + luckBonus) {
        // Drop Weapon Box
        const randWep = WEAPONS[Math.floor(Math.random() * WEAPONS.length)];
        pickups.push({ x: e.x, y: e.y, kind: 'weapon', weaponId: randWep.id, color: randWep.color });
      }
    }

    function checkCircleCollision(x1, y1, r1, x2, y2, r2) {
      return Math.hypot(x2 - x1, y2 - y1) < (r1 + r2);
    }

    function createExplosion(x, y, color, count = 10) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const spd = Math.random() * 4 + 1;
        particles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * spd,
          vy: Math.sin(angle) * spd,
          color: color,
          alpha: 1
        });
      }
    }

    function createHitParticles(x, y, color) {
      for (let i = 0; i < 3; i++) {
        particles.push({
          x: x,
          y: y,
          vx: (Math.random() - 0.5) * 4,
          vy: (Math.random() - 0.5) * 4,
          color: color,
          alpha: 0.8
        });
      }
    }

    function updateHUD() {
      document.getElementById('hud-enemies').innerText = `Quái: ${enemies.length + enemiesLeftToSpawn}`;
      document.getElementById('hud-score').innerText = score + ' PTS';
      document.getElementById('hud-credits').innerText = profile.credits + ' 🪙';

      const wep = WEAPONS.find(w => w.id === player.weapon);
      document.getElementById('hud-wep-name').innerText = wep.name;
      document.getElementById('hud-wep-name').style.color = wep.color;
      document.getElementById('hud-wep-lvl').innerText = `${player.weaponLvl} (${player.weaponProgress}/2)`;

      const hpPercent = Math.max(0, (player.hp / player.maxHp) * 100);
      document.getElementById('hp-bar-fill').style.width = hpPercent + '%';
    }

    /* =========================================================
       RENDER ENGINE
    ========================================================= */
    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 1. Draw Starfield
      ctx.fillStyle = '#ffffff';
      stars.forEach(s => {
        ctx.globalAlpha = 0.6;
        ctx.fillRect(s.x, s.y, s.size, s.size);
      });
      ctx.globalAlpha = 1.0;

      // 2. Draw Pickups
      pickups.forEach(p => {
        if (p.kind === 'hp') {
          ctx.fillStyle = '#00ff88';
          ctx.beginPath();
          ctx.arc(p.x, p.y, 10, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#fff';
          ctx.font = '10px Arial';
          ctx.fillText('💖', p.x - 6, p.y + 4);
        } else {
          ctx.fillStyle = p.color;
          ctx.fillRect(p.x - 8, p.y - 8, 16, 16);
          ctx.fillStyle = '#fff';
          ctx.font = '9px Arial';
          ctx.fillText('⚡', p.x - 4, p.y + 4);
        }
      });

      // 3. Draw Player Bullets
      bullets.forEach(b => {
        ctx.fillStyle = b.color;
        ctx.shadowBlur = 8;
        ctx.shadowColor = b.color;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
      });

      // 4. Draw Enemy Bullets
      enemyBullets.forEach(eb => {
        ctx.fillStyle = eb.color;
        ctx.shadowBlur = 6;
        ctx.shadowColor = eb.color;
        ctx.beginPath();
        ctx.arc(eb.x, eb.y, eb.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
      });

      // 5. Draw Enemies
      enemies.forEach(e => {
        ctx.fillStyle = e.type === 'shooter' ? '#ff3366' : '#ff9900';
        ctx.beginPath();
        ctx.moveTo(e.x, e.y + e.h / 2);
        ctx.lineTo(e.x - e.w / 2, e.y - e.h / 2);
        ctx.lineTo(e.x + e.w / 2, e.y - e.h / 2);
        ctx.closePath();
        ctx.fill();
      });

      // 6. Draw Boss
      if (boss) {
        ctx.fillStyle = '#ff0055';
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#ff0055';
        ctx.beginPath();
        ctx.arc(boss.x, boss.y, boss.w / 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;

        // Boss Core
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(boss.x, boss.y, boss.w / 4, 0, Math.PI * 2);
        ctx.fill();
      }

      // 7. Draw Player Ship
      ctx.fillStyle = player.hasShield ? '#00f3ff' : '#00ff88';
      ctx.shadowBlur = 10;
      ctx.shadowColor = ctx.fillStyle;
      ctx.beginPath();
      ctx.moveTo(player.x, player.y - player.h / 2);
      ctx.lineTo(player.x - player.w / 2, player.y + player.h / 2);
      ctx.lineTo(player.x + player.w / 2, player.y + player.h / 2);
      ctx.closePath();
      ctx.fill();
      ctx.shadowBlur = 0;

      // 8. Draw Particles
      particles.forEach(pt => {
        ctx.globalAlpha = Math.max(0, pt.alpha);
        ctx.fillStyle = pt.color;
        ctx.fillRect(pt.x, pt.y, 2.5, 2.5);
      });
      ctx.globalAlpha = 1.0;
    }

    function gameLoop() {
      update();
      render();
      requestAnimationFrame(gameLoop);
    }

    // Initialize Menu
    renderHangar();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
